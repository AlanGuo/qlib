[tool:pytest]
minversion = 6.0
testpaths = unit integration live mock performance
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    -ra
    --cov=../
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
markers =
    live: mark test as requiring live exchange API calls
    slow: mark test as slow running
    fast: mark test as fast running unit test
    unit: mark test as unit test
    integration: mark test as integration test
    validation: mark test as data validation test
    smoke: mark test as smoke test for quick validation
    parametrize: mark test as parametrized test
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning:ccxt
    ignore::UserWarning:requests
    ignore::UserWarning:urllib3
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_file_date_format = %Y-%m-%d %H:%M:%S
junit_family = xunit2
timeout = 300
timeout_method = thread