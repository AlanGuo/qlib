# Default configuration for cryptocurrency data collection
# This configuration provides sensible defaults for most use cases

collection:
  # Exchanges to collect data from
  exchanges:
    - binance
  
  # Symbols to collect (empty list means auto-discover)
  symbols: []
  
  # Timeframes to collect - using unified format (following Qlib project patterns)
  timeframes:
    - 1h
    - 1d
  
  # Fields to collect
  fields:
    - open
    - high
    - low
    - close
    - volume
  
  # Collection behavior
  max_workers: 4
  rate_limit_delay: 0.1
  retry_attempts: 3
  retry_delay: 1.0
  
  # Data range
  start_date: null
  end_date: null
  lookback_days: 365
  
  # Storage settings
  output_dir: "./crypto_data"
  file_format: "qlib"
  compression: "snappy"
  create_qlib_structure: true
  
  # Advanced settings
  enable_extended_fields: false
  enable_risk_metrics: false
  enable_validation: true
  incremental_update: true

# Incremental update configuration
incremental:
  # Basic settings
  enabled: true
  max_concurrent_updates: 10
  max_age_hours: 24
  max_consecutive_failures: 3

  # Update intervals (timeframe -> minutes)
  update_intervals:
    1min: 5      # Update every 5 minutes
    5min: 15     # Update every 15 minutes
    15min: 30    # Update every 30 minutes
    30min: 60    # Update every hour
    1h: 120      # Update every 2 hours
    1d: 1440     # Update every day

  # State management
  state_storage_type: "file"
  max_backups: 10
  auto_backup: true

  # Conflict resolution
  conflict_resolution: "keep_latest"
  quality_threshold: 0.1

  # Update strategy
  strategy_type: "time_based"

  # Recovery and monitoring
  enable_recovery: true
  recovery_timeout_minutes: 30
  progress_reporting: true
  detailed_logging: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: null
  max_file_size: 10485760  # 10MB
  backup_count: 5
  console_output: true

performance:
  # Memory management
  chunk_size: 10000
  max_memory_usage: 0.8
  
  # Parallel processing
  enable_multiprocessing: true
  process_pool_size: null  # Auto-detect
  
  # Caching
  enable_caching: true
  cache_size_limit: 1000
  cache_ttl: 3600
  
  # Database optimization
  batch_insert_size: 1000
  connection_pool_size: 5

risk:
  # General configuration
  calculation_frequency: "1h"
  cache_enabled: true
  cache_size_limit: 1000
  periods_per_year: 365
  
  # Data configuration
  price_column: "close"
  return_method: "log"
  min_periods_ratio: 0.5
  
  # Volatility configuration
  volatility_windows: [7, 30, 90, 252]
  volatility_annualize: true
  volatility_min_periods: null
  
  # VaR configuration
  var_confidence_levels: [0.01, 0.05, 0.10]
  var_methods: ["historical", "parametric"]
  var_windows: [30, 90, 252]
  var_monte_carlo_simulations: 10000
  
  # Drawdown configuration
  drawdown_lookback_periods: 1000
  drawdown_recovery_tracking: true
  
  # Sharpe ratio configuration
  sharpe_risk_free_rate: 0.02
  sharpe_windows: [30, 90, 252]
  
  # Beta configuration
  beta_windows: [30, 90, 252]
  beta_min_periods: 20

universe:
  name: "default"
  description: "Default cryptocurrency universe"
  
  # Exchange configuration
  exchanges:
    - binance
  primary_exchange: "binance"
  
  # Market types
  market_types:
    - spot
  
  # Filtering configuration
  filters:
    min_volume_24h: null
    max_volume_24h: null
    min_volume_usd_24h: null
    min_price: null
    max_price: null
    min_market_cap: null
    max_market_cap: null
    min_change_24h: null
    max_change_24h: null
    min_listing_days: null
    max_listing_days: null
    base_assets: null
    quote_assets: null
    exclude_base_assets: null
    exclude_quote_assets: null
    market_types:
      - spot
    custom_filters: null
  
  # Update configuration
  update_frequency: "daily"
  update_time: "00:00"
  
  # Size limits
  max_symbols: null
  min_symbols: null
  
  # Ranking criteria
  ranking_criteria:
    - volume_24h
  ranking_order: "desc"
  
  # Rebalancing
  rebalance_frequency: "weekly"
  rebalance_threshold: 0.1
  
  # Data collection settings
  collect_fields: null
  
  # Storage settings
  save_history: true
  history_retention_days: 365

validation:
  # General validation settings
  enable_price_validation: true
  enable_volume_validation: true
  enable_timeseries_validation: true
  enable_consistency_validation: true
  enable_anomaly_detection: true
  
  # Required and optional fields
  required_fields:
    - open
    - high
    - low
    - close
    - volume
  optional_fields:
    - volume_24h
    - volume_usd_24h
    - change_24h
    - funding_rate
    - open_interest
    - bid_ask_spread
    - liquidation_data
  
  # Completeness validation
  max_missing_ratio: 0.1
  min_rows: 1
  
  # Price validation
  max_price_change_pct: 50.0
  price_outlier_threshold: 3.0
  min_price: 0.0
  
  # Volume validation
  volume_outlier_threshold: 5.0
  min_volume: 0.0
  volume_spike_threshold: 10.0
  
  # Time series validation
  max_time_gap_minutes: 1440  # 24 hours
  duplicate_timestamp_action: "keep_last"
  
  # Consistency validation
  ohlc_consistency_check: true
  volume_price_consistency_check: true
  
  # Anomaly detection
  anomaly_detection_method: "isolation_forest"
  anomaly_contamination: 0.1
  price_anomaly_window: 100
  volume_anomaly_window: 100
