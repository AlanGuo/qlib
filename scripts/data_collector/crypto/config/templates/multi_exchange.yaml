# Multi-exchange configuration for cryptocurrency data collection
# Optimized for collecting data from multiple exchanges simultaneously

collection:
  # Multiple major exchanges
  exchanges:
    - binance
    - okx
  
  # Standard timeframes for multi-exchange
  timeframes:
    - 1h
    - 1d
  
  # Core fields available across exchanges
  fields:
    - open
    - high
    - low
    - close
    - volume
    - volume_24h
    - change_24h
  
  # Balanced collection settings for multiple exchanges
  max_workers: 6
  rate_limit_delay: 0.15  # Slightly higher to avoid rate limits
  retry_attempts: 4
  retry_delay: 1.5
  
  # Standard lookback
  lookback_days: 365
  
  # Multi-exchange storage
  output_dir: "./multi_exchange_data"
  file_format: "parquet"
  compression: "snappy"
  
  # Enable extended features
  enable_extended_fields: true
  enable_risk_metrics: true
  enable_validation: true
  incremental_update: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - [%(exchange)s] - %(message)s"
  file_path: "./logs/multi_exchange_collector.log"
  max_file_size: 52428800  # 50MB
  backup_count: 15
  console_output: true

performance:
  # Optimized for multi-exchange processing
  chunk_size: 8000
  max_memory_usage: 0.75
  
  # Controlled parallelization across exchanges
  enable_multiprocessing: true
  process_pool_size: 6
  
  # Enhanced caching for multi-exchange
  enable_caching: true
  cache_size_limit: 1200
  cache_ttl: 3600
  
  # Multi-exchange database settings
  batch_insert_size: 1500
  connection_pool_size: 8

risk:
  # Multi-exchange risk analysis
  calculation_frequency: "1h"
  cache_enabled: true
  cache_size_limit: 1200
  periods_per_year: 365
  
  # Standard volatility windows
  volatility_windows: [7, 30, 90, 252]
  volatility_annualize: true
  
  # Multi-exchange VaR
  var_confidence_levels: [0.01, 0.05, 0.10]
  var_methods: ["historical", "parametric"]
  var_windows: [30, 90, 252]
  var_monte_carlo_simulations: 10000
  
  # Standard drawdown settings
  drawdown_lookback_periods: 1000
  drawdown_recovery_tracking: true
  
  # Multi-exchange Sharpe
  sharpe_risk_free_rate: 0.02
  sharpe_windows: [30, 90, 252]

universe:
  name: "multi_exchange"
  description: "Multi-exchange cryptocurrency universe"
  
  # All configured exchanges
  exchanges:
    - binance
    - okx
  primary_exchange: "binance"
  
  market_types:
    - spot
    - futures
  
  # Filters suitable for multiple exchanges
  filters:
    min_volume_24h: 1000000  # 1M minimum volume
    min_volume_usd_24h: 100000  # 100K USD minimum
    base_assets:
      - BTC
      - ETH
      - BNB
      - ADA
      - DOT
      - LINK
      - UNI
      - AAVE
      - SOL
      - AVAX
      - MATIC
      - ATOM
      - XRP
      - LTC
      - BCH
    quote_assets:
      - USDT
      - BUSD
      - USDC
      - BTC
      - ETH
    market_types:
      - spot
      - futures
  
  # Daily updates
  update_frequency: "daily"
  update_time: "00:30"
  
  # Moderate universe size for multi-exchange
  max_symbols: 150
  min_symbols: 75
  
  ranking_criteria:
    - volume_24h
    - market_cap
  ranking_order: "desc"
  
  # Weekly rebalancing
  rebalance_frequency: "weekly"
  rebalance_threshold: 0.1
  
  # Multi-exchange data collection
  collect_fields:
    - open
    - high
    - low
    - close
    - volume
    - volume_24h
    - change_24h
  
  # Standard storage
  save_history: true
  history_retention_days: 730  # 2 years

validation:
  # Robust validation for multi-exchange data
  enable_price_validation: true
  enable_volume_validation: true
  enable_timeseries_validation: true
  enable_consistency_validation: true
  enable_anomaly_detection: true
  
  required_fields:
    - open
    - high
    - low
    - close
    - volume
  
  optional_fields:
    - volume_24h
    - change_24h
    - funding_rate
    - open_interest
  
  # Moderate completeness for multi-exchange
  max_missing_ratio: 0.08  # 8% max missing
  min_rows: 50
  
  # Standard price validation
  max_price_change_pct: 30.0  # 30% max change
  price_outlier_threshold: 3.0
  min_price: 0.0
  
  # Volume validation
  volume_outlier_threshold: 4.0
  min_volume: 0.0
  volume_spike_threshold: 10.0
  
  # Time series validation
  max_time_gap_minutes: 240  # 4 hours max gap
  duplicate_timestamp_action: "keep_last"
  
  # OHLC consistency
  ohlc_consistency_check: true
  volume_price_consistency_check: true
  
  # Multi-exchange anomaly detection
  anomaly_detection_method: "isolation_forest"
  anomaly_contamination: 0.12  # Slightly higher for multi-exchange
  price_anomaly_window: 100
  volume_anomaly_window: 100
