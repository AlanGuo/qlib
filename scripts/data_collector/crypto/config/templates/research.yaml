# Research configuration for cryptocurrency data collection
# Optimized for academic research and comprehensive analysis

collection:
  # Multiple exchanges for research
  exchanges:
    - binance
    - okx
  
  # Comprehensive timeframes for research
  timeframes:
    - 1min
    - 5min
    - 15min
    - 30min
    - 1h
    - day
  
  # All available fields for research
  fields:
    - open
    - high
    - low
    - close
    - volume
    - volume_24h
    - volume_usd_24h
    - change_24h
    - funding_rate
    - open_interest
    - bid_ask_spread
  
  # Moderate collection settings
  max_workers: 6
  rate_limit_delay: 0.1
  retry_attempts: 3
  retry_delay: 1.0
  
  # Extended historical data for research
  lookback_days: 1095  # 3 years
  
  # Research storage settings
  output_dir: "./research_crypto_data"
  file_format: "parquet"
  compression: "snappy"
  
  # Enable all features for research
  enable_extended_fields: true
  enable_risk_metrics: true
  enable_validation: true
  incremental_update: true

logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(funcName)s:%(lineno)d - %(message)s"
  file_path: "./logs/research_collector.log"
  max_file_size: 104857600  # 100MB
  backup_count: 10
  console_output: true

performance:
  # Research-optimized performance
  chunk_size: 15000
  max_memory_usage: 0.8
  
  # Full parallelization for research
  enable_multiprocessing: true
  process_pool_size: null
  
  # Extended caching for research
  enable_caching: true
  cache_size_limit: 1500
  cache_ttl: 7200  # 2 hours
  
  # Research database settings
  batch_insert_size: 2000
  connection_pool_size: 8

risk:
  # Comprehensive risk analysis for research
  calculation_frequency: "1h"
  cache_enabled: true
  cache_size_limit: 1500
  periods_per_year: 365
  
  # Extended volatility analysis
  volatility_windows: [7, 14, 30, 60, 90, 180, 252, 365]
  volatility_annualize: true
  
  # Comprehensive VaR analysis
  var_confidence_levels: [0.001, 0.01, 0.05, 0.10, 0.25]
  var_methods: ["historical", "parametric", "monte_carlo"]
  var_windows: [7, 14, 30, 60, 90, 180, 252]
  var_monte_carlo_simulations: 50000
  
  # Extended drawdown analysis
  drawdown_lookback_periods: 2000
  drawdown_recovery_tracking: true
  
  # Comprehensive Sharpe analysis
  sharpe_risk_free_rate: 0.02
  sharpe_windows: [7, 14, 30, 60, 90, 180, 252]
  
  # Extended beta analysis
  beta_windows: [30, 60, 90, 180, 252]
  beta_min_periods: 20

universe:
  name: "research"
  description: "Comprehensive research universe"
  
  exchanges:
    - binance
    - okx
  primary_exchange: "binance"
  
  # Include all market types for research
  market_types:
    - spot
    - futures
  
  # Broad filters for research
  filters:
    min_volume_24h: 100000  # 100K minimum volume
    min_volume_usd_24h: 10000  # 10K USD minimum
    quote_assets: 
      - USDT
      - BUSD
      - USDC
      - BTC
      - ETH
    market_types:
      - spot
      - futures
  
  # Daily updates for research
  update_frequency: "daily"
  update_time: "01:00"
  
  # Large universe for research
  max_symbols: 500
  min_symbols: 100
  
  ranking_criteria:
    - volume_24h
    - market_cap
    - change_24h
  ranking_order: "desc"
  
  # Weekly rebalancing for research
  rebalance_frequency: "weekly"
  rebalance_threshold: 0.15
  
  # Comprehensive data collection
  collect_fields:
    - open
    - high
    - low
    - close
    - volume
    - volume_24h
    - volume_usd_24h
    - change_24h
    - funding_rate
    - open_interest
    - bid_ask_spread
  
  # Long-term storage for research
  save_history: true
  history_retention_days: 1825  # 5 years

validation:
  # Comprehensive validation for research
  enable_price_validation: true
  enable_volume_validation: true
  enable_timeseries_validation: true
  enable_consistency_validation: true
  enable_anomaly_detection: true
  
  required_fields:
    - open
    - high
    - low
    - close
    - volume
  
  optional_fields:
    - volume_24h
    - volume_usd_24h
    - change_24h
    - funding_rate
    - open_interest
    - bid_ask_spread
    - liquidation_data
  
  # Moderate completeness for research
  max_missing_ratio: 0.15  # 15% max missing for research
  min_rows: 50
  
  # Flexible price validation for research
  max_price_change_pct: 100.0  # 100% max change for research
  price_outlier_threshold: 4.0
  min_price: 0.0
  
  # Volume validation
  volume_outlier_threshold: 6.0
  min_volume: 0.0
  volume_spike_threshold: 15.0
  
  # Flexible time series validation
  max_time_gap_minutes: 2880  # 48 hours max gap
  duplicate_timestamp_action: "keep_last"
  
  # OHLC consistency
  ohlc_consistency_check: true
  volume_price_consistency_check: false  # More flexible for research
  
  # Research anomaly detection
  anomaly_detection_method: "isolation_forest"
  anomaly_contamination: 0.2  # Higher tolerance for research
  price_anomaly_window: 200
  volume_anomaly_window: 200
